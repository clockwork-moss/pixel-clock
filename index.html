<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101c17"><title>Pixel Clock</title></head>
<body><main class="console"><header><span class="brand">◷ PIXEL / CLOCK</span><span class="badge">LOCAL TIME</span></header><nav aria-label="Clock mode"><button data-mode="clock">01 / CLOCK</button><button data-mode="stopwatch">02 / STOPWATCH</button><button data-mode="timer">03 / TIMER</button></nav><section class="screen" aria-label="Time display"><p id="status">READY</p><div id="display" role="timer">00:00:00</div><p id="detail"></p></section><div id="timer-config"><label>Countdown minutes <input id="minutes" type="number" min="0.01" max="1440" step="0.01" value="5"></label><button id="set">SET</button></div><div class="actions"><button id="toggle">START</button><button id="reset">RESET</button><span id="announcement" role="status" aria-live="polite"></span></div><footer><label>PHOSPHOR <select id="theme"><option value="moss">Moss</option><option value="amber">Amber</option><option value="ice">Ice</option></select></label><label class="format"><input id="hour12" type="checkbox">12-hour</label><small>1–3 switch · Space start/pause · R reset</small></footer></main><script type="module" src="/src/main.ts"></script></body></html>
